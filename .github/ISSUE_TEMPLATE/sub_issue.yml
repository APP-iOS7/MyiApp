name: 📌 서브 이슈
description: 부모 이슈(에픽)에 종속된 작업입니다.
title: "[Sub] "
labels: ["📌 sub"]
body:
  - type: markdown
    attributes:
      value: |
        서브 이슈는 부모 이슈(에픽)에 속한 작업입니다.
        - 부모 이슈 번호를 반드시 입력하세요
        - PR 머지 시 `Closes #이슈번호`로 이 서브 이슈만 종료됩니다
        - 부모 이슈는 모든 서브 이슈가 완료되면 수동으로 종료

  - type: input
    id: parent-issue
    attributes:
      label: 부모 이슈
      placeholder: "예: #123"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 작업 내용
      placeholder: 이 서브 이슈에서 수행할 구체적인 작업을 설명해 주세요.
    validations:
      required: true
