name: 🐛 버그 리포트
description: 예상과 다르게 동작하는 문제를 보고합니다.
title: "[Bug] "
labels: ["🐛 bug"]
body:
  - type: markdown
    attributes:
      value: |
        버그를 상세히 설명해 주세요. 가능하면 재현 방법을 포함해 주시면 도움이 됩니다.

  - type: input
    id: ios-version
    attributes:
      label: iOS 버전
      placeholder: "예: 17.0"
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: 앱 버전
      placeholder: "예: 1.2.0"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: 기기
      placeholder: "예: iPhone 15 Pro"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 예상 동작
      placeholder: 어떻게 동작해야 하는지 설명해 주세요.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 실제 동작
      placeholder: 실제로 어떻게 동작하는지 설명해 주세요.
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: 스크린샷/로그 (선택)
      placeholder: 가능하면 스크린샷이나 로그를 첨부해 주세요.
    validations:
      required: false
