name: ✨ 기능 요청
description: 새 기능 추가를 제안합니다.
title: "[Feature] "
labels: ["✨ feature"]
body:
  - type: markdown
    attributes:
      value: |
        제안하는 기능을 상세히 설명해 주세요.

  - type: textarea
    id: background
    attributes:
      label: 배경/동기
      placeholder: 이 기능이 왜 필요한지, 어떤 문제를 해결하는지 설명해 주세요.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 제안 내용
      placeholder: 구체적으로 어떤 기능을 원하는지 설명해 주세요.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 대안 (선택)
      placeholder: 고려한 다른 방법이 있다면 적어 주세요.
    validations:
      required: false
