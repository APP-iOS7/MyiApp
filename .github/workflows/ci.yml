name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: Tuist auth login
        run: tuist auth login

      - name: Tuist setup cache
        run: tuist setup cache

      - name: Run tests
        run: tuist test MyiApp
