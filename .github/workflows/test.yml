name: Test

on:
  workflow_call:

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: macos-latest
    env:
      TUIST_XDG_STATE_HOME: /tmp/tuist-state
    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v4

      - name: Tuist auth login
        run: tuist auth login

      - name: Cache Tuist dependencies
        uses: actions/cache@v4
        with:
          path: Tuist/.build
          key: ${{ runner.os }}-tuist-${{ hashFiles('Tuist/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-tuist-

      - name: Tuist install
        run: tuist install

      - name: Tuist setup cache
        run: tuist setup cache

      - name: Create GoogleService-Info.plist from Secret
        run: echo "${{ secrets.GOOGLE_SERVICES_PLIST }}" > App/Resources/GoogleService-Info.plist

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Firebase Emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: ${{ runner.os }}-firebase-emulators-${{ hashFiles('firebase.json') }}
          restore-keys: |
            ${{ runner.os }}-firebase-emulators-

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Run tests with Firebase Emulator
        run: firebase emulators:exec --project demo-myiapp "tuist test"

      - name: Upload Tuist session logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: tuist-session-logs
          path: /tmp/tuist-state/tuist/sessions/
          if-no-files-found: ignore
