name: Test

on:
  workflow_call:

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: Tuist auth login
        run: tuist auth login

      - name: Tuist setup cache
        run: tuist setup cache

      - name: Clean selective tests cache
        run: tuist clean selectiveTests

      - name: Run tests
        run: tuist test MyiApp
