<svg width="1200" height="680" viewBox="0 0 1200 680" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">My I problem and solution map</title>
  <desc id="desc">아기 울음 판단, 기록 분산, 보호자 공유, 패턴 파악, 일정 누락 문제를 My I의 기능으로 연결한 다이어그램입니다.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1D2B3A" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="headerGradient" x1="80" y1="44" x2="1120" y2="132" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7FBFF"/>
      <stop offset="1" stop-color="#FFF8F4"/>
    </linearGradient>
    <style>
      .title { font: 700 36px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #152233; }
      .subtitle { font: 500 18px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #526274; }
      .header { font: 700 22px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #152233; }
      .body { font: 600 19px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #243244; }
      .small { font: 600 16px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #4D5B6C; }
      .pill { font: 700 15px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #236483; }
      .number { font: 700 17px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #FFFFFF; }
    </style>
  </defs>

  <rect width="1200" height="680" rx="40" fill="#F5F8FB"/>
  <rect x="56" y="40" width="1088" height="104" rx="30" fill="url(#headerGradient)" filter="url(#shadow)"/>
  <text x="92" y="86" class="title">문제 정의와 해결 방향</text>
  <text x="92" y="118" class="subtitle">초보 부모와 공동 양육자가 겪는 반복 문제를 My I의 핵심 기능으로 연결했습니다.</text>

  <rect x="70" y="184" width="320" height="54" rx="16" fill="#EAF2FF"/>
  <text x="184" y="219" text-anchor="middle" class="header">사용자 문제</text>
  <rect x="440" y="184" width="320" height="54" rx="16" fill="#FFF1E8"/>
  <text x="600" y="219" text-anchor="middle" class="header">해결 방식</text>
  <rect x="810" y="184" width="320" height="54" rx="16" fill="#EAF8F0"/>
  <text x="970" y="219" text-anchor="middle" class="header">연결 기능</text>

  <g filter="url(#shadow)">
    <rect x="70" y="270" width="320" height="60" rx="18" fill="#FFFFFF"/>
    <circle cx="100" cy="300" r="16" fill="#5A8DEE"/>
    <text x="100" y="306" text-anchor="middle" class="number">1</text>
    <text x="130" y="306" class="body">울음 원인 판단이 어렵다</text>

    <rect x="440" y="270" width="320" height="60" rx="18" fill="#FFFFFF"/>
    <text x="600" y="294" text-anchor="middle" class="body">울음소리 분석으로</text>
    <text x="600" y="318" text-anchor="middle" class="small">상태 판단을 보조</text>

    <rect x="810" y="270" width="320" height="60" rx="18" fill="#FFFFFF"/>
    <rect x="904" y="286" width="132" height="28" rx="14" fill="#DDF4FF"/>
    <text x="970" y="306" text-anchor="middle" class="pill">울음 분석</text>

    <rect x="70" y="354" width="320" height="60" rx="18" fill="#FFFFFF"/>
    <circle cx="100" cy="384" r="16" fill="#5A8DEE"/>
    <text x="100" y="390" text-anchor="middle" class="number">2</text>
    <text x="130" y="390" class="body">육아 기록이 흩어진다</text>

    <rect x="440" y="354" width="320" height="60" rx="18" fill="#FFFFFF"/>
    <text x="600" y="378" text-anchor="middle" class="body">타임라인과 수첩에</text>
    <text x="600" y="402" text-anchor="middle" class="small">하루 기록을 통합</text>

    <rect x="810" y="354" width="320" height="60" rx="18" fill="#FFFFFF"/>
    <rect x="884" y="370" width="172" height="28" rx="14" fill="#DDF4FF"/>
    <text x="970" y="390" text-anchor="middle" class="pill">홈 · 육아 수첩</text>

    <rect x="70" y="438" width="320" height="60" rx="18" fill="#FFFFFF"/>
    <circle cx="100" cy="468" r="16" fill="#5A8DEE"/>
    <text x="100" y="474" text-anchor="middle" class="number">3</text>
    <text x="130" y="474" class="body">보호자 공유가 어렵다</text>

    <rect x="440" y="438" width="320" height="60" rx="18" fill="#FFFFFF"/>
    <text x="600" y="462" text-anchor="middle" class="body">Firebase 동기화로</text>
    <text x="600" y="486" text-anchor="middle" class="small">아기 정보를 함께 관리</text>

    <rect x="810" y="438" width="320" height="60" rx="18" fill="#FFFFFF"/>
    <rect x="890" y="454" width="160" height="28" rx="14" fill="#DDF4FF"/>
    <text x="970" y="474" text-anchor="middle" class="pill">공동 양육자</text>

    <rect x="70" y="522" width="320" height="60" rx="18" fill="#FFFFFF"/>
    <circle cx="100" cy="552" r="16" fill="#5A8DEE"/>
    <text x="100" y="558" text-anchor="middle" class="number">4</text>
    <text x="130" y="558" class="body">패턴 파악이 어렵다</text>

    <rect x="440" y="522" width="320" height="60" rx="18" fill="#FFFFFF"/>
    <text x="600" y="546" text-anchor="middle" class="body">누적 기록을 통계로</text>
    <text x="600" y="570" text-anchor="middle" class="small">시각화해 흐름 확인</text>

    <rect x="810" y="522" width="320" height="60" rx="18" fill="#FFFFFF"/>
    <rect x="910" y="538" width="120" height="28" rx="14" fill="#DDF4FF"/>
    <text x="970" y="558" text-anchor="middle" class="pill">기록 분석</text>

    <rect x="70" y="606" width="320" height="60" rx="18" fill="#FFFFFF"/>
    <circle cx="100" cy="636" r="16" fill="#5A8DEE"/>
    <text x="100" y="642" text-anchor="middle" class="number">5</text>
    <text x="130" y="642" class="body">일정을 놓치기 쉽다</text>

    <rect x="440" y="606" width="320" height="60" rx="18" fill="#FFFFFF"/>
    <text x="600" y="630" text-anchor="middle" class="body">일정과 리마인더로</text>
    <text x="600" y="654" text-anchor="middle" class="small">보호자에게 알림</text>

    <rect x="810" y="606" width="320" height="60" rx="18" fill="#FFFFFF"/>
    <rect x="910" y="622" width="120" height="28" rx="14" fill="#DDF4FF"/>
    <text x="970" y="642" text-anchor="middle" class="pill">일정 · 알림</text>
  </g>

  <path d="M404 300H426" stroke="#B8C7D8" stroke-width="4" stroke-linecap="round"/>
  <path d="M426 300L416 291M426 300L416 309" stroke="#B8C7D8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M774 300H796" stroke="#B8C7D8" stroke-width="4" stroke-linecap="round"/>
  <path d="M796 300L786 291M796 300L786 309" stroke="#B8C7D8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M404 384H426" stroke="#B8C7D8" stroke-width="4" stroke-linecap="round"/>
  <path d="M426 384L416 375M426 384L416 393" stroke="#B8C7D8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M774 384H796" stroke="#B8C7D8" stroke-width="4" stroke-linecap="round"/>
  <path d="M796 384L786 375M796 384L786 393" stroke="#B8C7D8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M404 468H426" stroke="#B8C7D8" stroke-width="4" stroke-linecap="round"/>
  <path d="M426 468L416 459M426 468L416 477" stroke="#B8C7D8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M774 468H796" stroke="#B8C7D8" stroke-width="4" stroke-linecap="round"/>
  <path d="M796 468L786 459M796 468L786 477" stroke="#B8C7D8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M404 552H426" stroke="#B8C7D8" stroke-width="4" stroke-linecap="round"/>
  <path d="M426 552L416 543M426 552L416 561" stroke="#B8C7D8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M774 552H796" stroke="#B8C7D8" stroke-width="4" stroke-linecap="round"/>
  <path d="M796 552L786 543M796 552L786 561" stroke="#B8C7D8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M404 636H426" stroke="#B8C7D8" stroke-width="4" stroke-linecap="round"/>
  <path d="M426 636L416 627M426 636L416 645" stroke="#B8C7D8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M774 636H796" stroke="#B8C7D8" stroke-width="4" stroke-linecap="round"/>
  <path d="M796 636L786 627M796 636L786 645" stroke="#B8C7D8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
