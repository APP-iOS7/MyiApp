<svg width="1200" height="760" viewBox="0 0 1200 760" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">My I modular architecture</title>
  <desc id="desc">My I 앱의 Tuist 타깃 구조를 앱, 기능, 도메인, 클라이언트, 디자인 시스템, 공유 기반 레이어로 표현한 아키텍처 다이어그램입니다.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1D2B3A" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="headerGradient" x1="80" y1="44" x2="1120" y2="132" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7FBFF"/>
      <stop offset="1" stop-color="#FFF8F4"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#B8C7D8"/>
    </marker>
    <style>
      .title { font: 700 36px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #152233; }
      .subtitle { font: 500 18px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #526274; }
      .layer { font: 700 15px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #6A7A8D; }
      .cardTitle { font: 700 25px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #152233; }
      .cardBody { font: 600 17px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #4D5B6C; }
      .chip { font: 700 15px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #236483; }
      .small { font: 600 15px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #5D6D7E; }
      .service { font: 700 13px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #4D6A7B; }
      .icon { font: 700 18px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #FFFFFF; }
      .arrowLine { stroke: #B8C7D8; stroke-width: 4; stroke-linecap: round; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="760" rx="40" fill="#F5F8FB"/>
  <rect x="56" y="40" width="1088" height="104" rx="30" fill="url(#headerGradient)" filter="url(#shadow)"/>
  <text x="92" y="86" class="title">아키텍처</text>
  <text x="92" y="118" class="subtitle">앱 진입점, 기능, 도메인 계약, 라이브 클라이언트, 디자인 시스템을 타깃 단위로 분리했습니다.</text>

  <text x="88" y="185" class="layer">APP SHELL</text>
  <g filter="url(#shadow)">
    <rect x="80" y="202" width="1040" height="92" rx="24" fill="#FFFFFF"/>
    <circle cx="128" cy="248" r="28" fill="#5A8DEE"/>
    <text x="128" y="255" text-anchor="middle" class="icon">앱</text>
    <text x="174" y="238" class="cardTitle">MyI</text>
    <text x="174" y="268" class="cardBody">앱 진입점, AppDelegate, 런치 화면, Firebase 초기화와 앱 생명주기 연결</text>
    <rect x="934" y="226" width="142" height="32" rx="16" fill="#DDF4FF"/>
    <text x="1005" y="248" text-anchor="middle" class="chip">iOS App Target</text>
  </g>

  <path d="M600 294V334" class="arrowLine"/>

  <text x="88" y="338" class="layer">FEATURE LAYER</text>
  <g filter="url(#shadow)">
    <rect x="80" y="356" width="1040" height="120" rx="24" fill="#FFFFFF"/>
    <circle cx="128" cy="416" r="28" fill="#82D7F7"/>
    <text x="128" y="423" text-anchor="middle" class="icon">기능</text>
    <text x="174" y="396" class="cardTitle">Features</text>
    <text x="174" y="426" class="cardBody">로그인, 홈, 울음 분석, 육아 수첩, 통계, 설정 화면을 기능 단위로 구성</text>
    <rect x="174" y="440" width="80" height="28" rx="14" fill="#EAF2FF"/>
    <text x="214" y="459" text-anchor="middle" class="small">Login</text>
    <rect x="264" y="440" width="74" height="28" rx="14" fill="#EAF2FF"/>
    <text x="301" y="459" text-anchor="middle" class="small">Home</text>
    <rect x="348" y="440" width="116" height="28" rx="14" fill="#EAF2FF"/>
    <text x="406" y="459" text-anchor="middle" class="small">CryAnalysis</text>
    <rect x="474" y="440" width="70" height="28" rx="14" fill="#EAF2FF"/>
    <text x="509" y="459" text-anchor="middle" class="small">Note</text>
    <rect x="554" y="440" width="96" height="28" rx="14" fill="#EAF2FF"/>
    <text x="602" y="459" text-anchor="middle" class="small">Statistic</text>
    <rect x="660" y="440" width="92" height="28" rx="14" fill="#EAF2FF"/>
    <text x="706" y="459" text-anchor="middle" class="small">Settings</text>
  </g>

  <path d="M350 476V522" class="arrowLine"/>
  <path d="M600 476V522" class="arrowLine"/>
  <path d="M850 476V522" class="arrowLine"/>

  <text x="88" y="526" class="layer">CORE MODULES</text>
  <g filter="url(#shadow)">
    <rect x="80" y="548" width="320" height="132" rx="24" fill="#FFFFFF"/>
    <circle cx="126" cy="614" r="26" fill="#5A8DEE"/>
    <text x="126" y="621" text-anchor="middle" class="icon">D</text>
    <text x="166" y="600" class="cardTitle">Domain</text>
    <text x="166" y="630" class="cardBody">모델, 에러, 클라이언트</text>
    <text x="166" y="654" class="cardBody">인터페이스 정의</text>

    <rect x="440" y="548" width="320" height="132" rx="24" fill="#FFFFFF"/>
    <circle cx="486" cy="614" r="26" fill="#5A8DEE"/>
    <text x="486" y="621" text-anchor="middle" class="icon">C</text>
    <text x="526" y="600" class="cardTitle">Clients</text>
    <text x="526" y="630" class="cardBody">외부 의존성 구현 캡슐화</text>
    <rect x="468" y="648" width="74" height="24" rx="12" fill="#E8F7F2"/>
    <text x="505" y="665" text-anchor="middle" class="service">Firebase</text>
    <rect x="550" y="648" width="64" height="24" rx="12" fill="#E8F7F2"/>
    <text x="582" y="665" text-anchor="middle" class="service">Google</text>
    <rect x="622" y="648" width="68" height="24" rx="12" fill="#E8F7F2"/>
    <text x="656" y="665" text-anchor="middle" class="service">Core ML</text>
    <rect x="698" y="648" width="44" height="24" rx="12" fill="#E8F7F2"/>
    <text x="720" y="665" text-anchor="middle" class="service">알림</text>

    <rect x="800" y="548" width="320" height="132" rx="24" fill="#FFFFFF"/>
    <circle cx="846" cy="614" r="26" fill="#5A8DEE"/>
    <text x="846" y="621" text-anchor="middle" class="icon">UI</text>
    <text x="886" y="600" class="cardTitle">DesignSystem</text>
    <text x="886" y="630" class="cardBody">색상, 폰트, 버튼, 카드,</text>
    <text x="886" y="654" class="cardBody">캘린더, 차트 컴포넌트</text>
  </g>

  <path d="M350 680V712" class="arrowLine"/>
  <path d="M600 680V712" class="arrowLine"/>
  <path d="M850 680V712" class="arrowLine"/>

  <g filter="url(#shadow)">
    <rect x="80" y="716" width="1040" height="36" rx="18" fill="#FFFFFF"/>
    <text x="114" y="741" class="cardTitle">Shared</text>
    <text x="220" y="741" class="cardBody">공통 확장, 캐시, 로깅 등 모든 모듈에서 재사용되는 기반 유틸리티</text>
  </g>
</svg>
